version: 2

models:
  - name: int_customer_orders
    description: "Intermediate model for customer orders."

    columns:
      - name: order_id
        description: "Unique identifier for the order."
        tests:
          - not_null
          - unique
      
      - name: customer_id
        description: "Identifier for the customer."
        tests:
          - not_null

      - name: order_sla
        description: "Shows if an order was delivered on time."
        tests:
          - not_null

  - name: int_order_payments
    description: "Intermediate model for order payments."

    columns:
      - name: "order_id"
        description: "Unique identifier for the order."
        tests:
          - not_null
          - unique

      - name: "payment_count"
        description: "Number of payments per order id."
        tests:
          - not_null
      
      - name: "total_payment_value"
        description: "Sum of all payments per order id."
        tests:
          - not_null

      - name: "payment_types"
        description: "List of all payment method used in this order."
        tests:
          - not_null

  - name: int_product_sales
    description: "Intermediate model for product sales."

    columns:
      - name: "product_id"
        description: "Unique identifier for products."
        tests:
          - not_null
          - unique
      
      - name: "category_name"
        description: "English category name for the product."
        tests:
          - not_null

  - name: "int_shipping"
    description: "Intermediate model for olist order shipping."
    
    columns:
      - name: "order_id"
        description: "Unique identifier for orders."
        tests:
          - not_null
          - unique
      
      - name: "customer_id"
        description: "Identifier for customers."
        tests:
          - not_null
    