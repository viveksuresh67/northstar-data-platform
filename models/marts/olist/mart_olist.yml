version: 2

models:
  - name: fct_orders
    description: "Table that has order details"

    columns:
      - name: order_id
        description: "Unique id that represents an order"
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Id that represents a customer"
        tests:
          - not_null

      - name: order_status
        description: "Status of an order"
        tests:
          - not_null

      - name: order_sla
        description: "This field shows if an order has met the agreed service"
        tests:
          - not_null

  - name: dim_customers
    description: "Dimension table that has customer order details"

    columns:
      - name: customer_unique_id
        description: "Unique id that represents a customer"
        tests:
          - unique
          - not_null

      - name: first_order_date
        description: "Date when the customer made the first order"
        tests:
          - not_null

      - name: latest_order_date
        description: "Date when the customer made the last order"
        tests:
          - not_null

  - name: dim_products
    description: "Dimension table that shows product details and sales"

    columns:
      - name: product_id
        description: "unique id that represents a product"
        tests:
          - unique
          - not_null

  - name: dim_dates
    description: "Table with calendar dates and details"

    columns:
      - name: calendar_date
        description: "Shows the actual calendar date"

        tests:
          - unique
          - not_null

  - name: dim_sellers
    description: "Sellers information with aggregated order details"

    columns:
      - name: seller_id
        description: "unique id to identify the seller"

        tests:
          - unique
          - not_null