version: 2

models:
  - name: stg_olist_customers
    description: "Staging model for Olist customer data."

    columns:
      - name: customer_id
        description: "Unique identifier for the customer record."
        tests:
          - not_null
          - unique

  - name: stg_olist_geolocation
    description: "Staging model for Olist geolocation data."

    columns:
      - name: geoloc_zip_code_prefix
        description: "ZIP code prefix associated with the geolocation record."

      - name: geoloc_lat
        description: "latitude of the geolocation, cast to FLOAT."

      - name: geoloc_lng
        description: "longitude of the geolocation, cast to FLOAT."

  - name: stg_olist_orders
    description: "Staging model for olist orders data."

    columns:
      - name: order_id
        description: "unique identification for order records."
        tests:
          - not_null
          - unique

  - name: stg_olist_order_items
    description: "Staging model for olist order item data."

    columns:
      - name: order_id
        description: "Identifier for the order."
        tests:
          - not_null

      - name: order_item_id
        description: "Identifier for items within an order."
        tests:
          - not_null

      - name: product_id
        description: "Identifier for the product."
        tests:
          - not_null

      - name: seller_id
        description: "Identifier for the seller."
        tests:
          - not_null

  - name: stg_olist_order_payments
    description: "Staging model for olist order payments data."

    columns:
      - name: order_id
        description: "Identifier for the order."
        tests:
          - not_null

      - name: payment_sequential
        description: "Sequence number of the payment within the order."
        tests:
          - not_null

      - name: payment_type
        description: "Identifies the payment method."
        tests:
          - not_null

      - name: payment_installments
        description: "Number of installments for the payment."
        tests:
          - not_null

      - name: payment_value
        description: "Payment amount associated with the order."
        tests:
          - not_null

  - name: stg_olist_order_reviews
    description: "Staging model for olist order reviews."
    
    columns:
      - name: review_id
        description: "Unique identifier for olist order reviews."
        tests:
          - not_null
      
      - name: order_id
        description: "Identifies the order."
        tests:
          - not_null

      - name: review_score
        description: "Record to show the score based on the order."
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
    
  - name: stg_olist_products
    description: "Staging model for olist products data."

    columns:
      - name: product_id
        description: "Unique identifier for products."
        tests:
          - not_null
          - unique

  - name: stg_olist_sellers
    description: "staging model for olist sellers data."

    columns:
      - name: seller_id
        description: "Unique identifier for sellers."
        tests:
          - not_null
          - unique

  - name: stg_olist_product_category_name_translation
    description: "Staging model for category name translation data."

    columns:
      - name: product_category_name
        description: "Original Portuguese product category name."
        tests:
          - not_null

      